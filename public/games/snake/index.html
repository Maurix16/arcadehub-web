<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Classic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f172a; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #score-board {
      color: #38bdf8; font-size: 20px; font-weight: bold; margin-bottom: 12px;
    }
    canvas {
      background: #1e293b; border: 3px solid #3b82f6; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="score-board">Skor: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let score = 0;
    let gameOver = false;

    function gameLoop() {
      if (gameOver) return;
      update();
      draw();
      setTimeout(gameLoop, 100);
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Menabrak dinding
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return setGameOver();
      }

      // Menabrak tubuh sendiri
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) return setGameOver();
      }

      snake.unshift(head);

      // Makan makanan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gambar Makanan
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((food.x * gridSize) + 10, (food.y * gridSize) + 10, 8, 0, Math.PI * 2);
      ctx.fill();

      // Gambar Ular
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#10b981' : '#34d399';
        ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    function setGameOver() {
      gameOver = true;
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '14px sans-serif';
      ctx.fillText('Tekan Spasi untuk Main Lagi', canvas.width / 2, canvas.height / 2 + 20);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
      else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
      else if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
      else if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
      else if (e.code === 'Space' && gameOver) {
        snake = [{ x: 10, y: 10 }];
        dx = 1; dy = 0; score = 0;
        scoreEl.innerText = score;
        gameOver = false;
        placeFood();
        gameLoop();
      }
    });

    gameLoop();
  </script>
</body>
</html>
