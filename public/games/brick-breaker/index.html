<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker Neon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #090d16; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      background: #0f172a; border: 2px solid #a855f7; border-radius: 12px;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="480" height="400"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;

    const paddle = { x: 190, y: 370, w: 100, h: 12, dx: 7 };
    const ball = { x: 240, y: 350, r: 7, dx: 4, dy: -4 };

    const brick = { rowCount: 4, columnCount: 6, width: 68, height: 18, padding: 8, offsetTop: 30, offsetLeft: 14 };
    const bricks = [];

    for (let c = 0; c < brick.columnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brick.rowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
      }
    }

    let rightPressed = false;
    let leftPressed = false;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
      if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
      if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
    });

    document.addEventListener('mousemove', (e) => {
      const relativeX = e.clientX - canvas.offsetLeft;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.w / 2;
      }
    });

    function collisionDetection() {
      for (let c = 0; c < brick.columnCount; c++) {
        for (let r = 0; r < brick.rowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            if (ball.x > b.x && ball.x < b.x + brick.width && ball.y > b.y && ball.y < b.y + brick.height) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 10;
              if (score === brick.rowCount * brick.columnCount * 10) {
                alert('SELAMAT! Anda Menang!');
                document.location.reload();
              }
            }
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gambar Bricks
      for (let c = 0; c < brick.columnCount; c++) {
        for (let r = 0; r < brick.rowCount; r++) {
          if (bricks[c][r].status === 1) {
            const bx = c * (brick.width + brick.padding) + brick.offsetLeft;
            const by = r * (brick.height + brick.padding) + brick.offsetTop;
            bricks[c][r].x = bx;
            bricks[c][r].y = by;
            ctx.fillStyle = ['#ec4899', '#a855f7', '#3b82f6', '#10b981'][r];
            ctx.fillRect(bx, by, brick.width, brick.height);
          }
        }
      }

      // Gambar Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();
      ctx.closePath();

      // Gambar Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      // Skor
      ctx.font = '14px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Skor: ' + score, 15, 20);

      collisionDetection();

      // Pantulan Dinding
      if (ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) ball.dx = -ball.dx;
      if (ball.y + ball.dy < ball.r) ball.dy = -ball.dy;
      else if (ball.y + ball.dy > canvas.height - ball.r) {
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
          ball.dy = -ball.dy;
        } else {
          alert('Game Over! Skor Akhir: ' + score);
          document.location.reload();
        }
      }

      if (rightPressed && paddle.x < canvas.width - paddle.w) paddle.x += paddle.dx;
      else if (leftPressed && paddle.x > 0) paddle.x -= paddle.dx;

      ball.x += ball.dx;
      ball.y += ball.dy;

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
