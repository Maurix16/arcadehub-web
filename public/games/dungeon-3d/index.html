<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dungeon Quest 3D - Ultra Smooth & FX RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    
    canvas {
      display: block; width: 100vw; height: 100vh; image-rendering: -webkit-optimize-contrast;
    }

    #loading {
      position: absolute; inset: 0; background: #070a13; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid #1e293b; border-top-color: #38bdf8;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* HUD PERANG & STATUS */
    #ui {
      position: absolute; top: 16px; left: 16px; z-index: 10; pointer-events: none;
    }
    .card-hud {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 12px 18px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6); color: #fff;
    }
    .hp-bg {
      width: 190px; height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden;
      margin: 6px 0; border: 1px solid rgba(255,255,255,0.1);
    }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #dc2626, #ef4444); transition: width 0.15s ease; }

    #controls-hint {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 10px 22px;
      border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.3); color: #f8fafc; font-size: 12px;
      pointer-events: none; text-align: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div style="font-weight: 700; font-size: 15px; letter-spacing: 1px; color: #38bdf8;">MENYIAPKAN ARENA & EFEK PERANG 3D...</div>
    <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Optimasi 60 FPS & Rendering Efek Pedang</div>
  </div>

  <div id="ui">
    <div class="card-hud">
      <div style="color: #f59e0b; font-weight: 800; font-size: 13px; letter-spacing: 0.5px;">⚔️ KESATRIA DUNGEON</div>
      <div class="hp-bg"><div id="hp-bar" class="hp-fill" style="width: 100%;"></div></div>
      <div style="font-size: 11px; color: #94a3b8; margin-top: 2px;">
        Level: <strong id="lvl" style="color:white;">1</strong> | Demon Kalahkan: <strong id="kills" style="color:#38bdf8;">0</strong>
      </div>
    </div>
  </div>

  <div id="controls-hint">
    🖱️ <strong>Drag Mouse</strong> = Putar Kamera 360° | 🎮 <strong>WASD</strong> = Jalan Terarah | ⚔️ <strong>Spasi / Klik</strong> = Tebasan Pedang
  </div>

  <script>
    // 1. SCENE & OPTIMASI RINGAN (TANPA LAG)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060913);
    scene.fog = new THREE.FogExp2(0x060913, 0.022);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Mencegah lag GPU
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // 2. LIGHTING PERANG & AMBIENT
    const ambientLight = new THREE.AmbientLight(0x1e293b, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.8);
    sunLight.position.set(15, 25, 15);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // Cahaya Biru Aura Pedang Kesatria
    const swordAuraLight = new THREE.PointLight(0x38bdf8, 2, 8);
    scene.add(swordAuraLight);

    // 3. ARENA DUNGEON BATU REALISTIS
    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6, metalness: 0.3 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(80, 32, 0x0284c7, 0x1e293b);
    grid.position.y = 0.01;
    scene.add(grid);

    // Pilar Batu Arena
    function createPillar(x, z) {
      const g = new THREE.CylinderGeometry(0.8, 1.1, 6, 12);
      const m = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const p = new THREE.Mesh(g, m);
      p.position.set(x, 3, z);
      p.castShadow = true;
      p.receiveShadow = true;
      scene.add(p);
    }
    [-15, 15].forEach(x => [-15, 15].forEach(z => createPillar(x, z)));

    // 4. MODEL KESATRIA DENGAN ZIRAH LENGKAP & PEDANG KEREN
    function createKnightModel() {
      const knight = new THREE.Group();

      // Baju Zirah Badan (Chestplate)
      const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.1, 10);
      const armorMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.85, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, armorMat);
      body.position.y = 1.0;
      body.castShadow = true;
      knight.add(body);

      // Helm Kesatria (Helmet with Visor)
      const helmGeo = new THREE.SphereGeometry(0.35, 12, 12);
      const helmMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9, roughness: 0.1 });
      const helm = new THREE.Mesh(helmGeo, helmMat);
      helm.position.y = 1.8;
      helm.castShadow = true;
      knight.add(helm);

      // Bulu Mahkota Helm (Plume)
      const plumeGeo = new THREE.ConeGeometry(0.12, 0.4, 8);
      const plumeMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      const plume = new THREE.Mesh(plumeGeo, plumeMat);
      plume.position.set(0, 2.1, -0.1);
      plume.rotation.x = -0.3;
      knight.add(plume);

      // Bahu Pelindung (Pauldrons)
      [-0.6, 0.6].forEach(x => {
        const pGeo = new THREE.SphereGeometry(0.22, 8, 8);
        const pauldron = new THREE.Mesh(pGeo, armorMat);
        pauldron.position.set(x, 1.4, 0);
        knight.add(pauldron);
      });

      // Kaki & Tangan
      const limbMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5 });
      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8), limbMat);
      legL.position.set(-0.22, 0.4, 0);
      legL.castShadow = true;
      knight.add(legL);

      const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8), limbMat);
      legR.position.set(0.22, 0.4, 0);
      legR.castShadow = true;
      knight.add(legR);

      // Lengan Kanan yang Memegang Pedang
      const armRGroup = new THREE.Group();
      armRGroup.position.set(0.55, 1.3, 0);
      
      const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.7), limbMat);
      armR.position.y = -0.3;
      armRGroup.add(armR);

      // PEDANG GREATSWORD RAJA
      const swordGroup = new THREE.Group();
      
      // Bilah Pedang (Blade)
      const bladeGeo = new THREE.BoxGeometry(0.12, 1.8, 0.04);
      const bladeMat = new THREE.MeshStandardMaterial({
        color: 0xf8fafc,
        metalness: 0.95,
        roughness: 0.1,
        emissive: 0x0284c7,
        emissiveIntensity: 0.3
      });
      const blade = new THREE.Mesh(bladeGeo, bladeMat);
      blade.position.y = 0.9;
      blade.castShadow = true;
      swordGroup.add(blade);

      // Pelindung Emas (Crossguard)
      const guardGeo = new THREE.BoxGeometry(0.5, 0.08, 0.12);
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 });
      const guard = new THREE.Mesh(guardGeo, goldMat);
      guard.position.y = 0.1;
      swordGroup.add(guard);

      swordGroup.position.set(0, -0.5, 0.2);
      swordGroup.rotation.x = Math.PI / 3;
      armRGroup.add(swordGroup);

      knight.add(armRGroup);

      return {
        mesh: knight,
        armR: armRGroup,
        sword: swordGroup,
        legL: legL,
        legR: legR
      };
    }

    const player = createKnightModel();
    scene.add(player.mesh);

    // EFEK TEBASAN PEDANG (SWORD SLASH ARC)
    const slashGeo = new THREE.RingGeometry(0.8, 2.2, 32, 1, 0, Math.PI * 0.85);
    const slashMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const slashArc = new THREE.Mesh(slashGeo, slashMat);
    slashArc.rotation.x = Math.PI / 2;
    scene.add(slashArc);

    // SISTEM PARTIKEL PERANG (SPARKS & BLOOD/BURST)
    const particleCount = 40;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleVelocities = [];

    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3] = 0;
      particlePositions[i * 3 + 1] = -10;
      particlePositions[i * 3 + 2] = 0;
      particleVelocities.push(new THREE.Vector3());
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.2, transparent: true, opacity: 0 });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    function triggerHitSparks(pos) {
      particleMat.opacity = 1.0;
      const positions = particleSystem.geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = pos.x;
        positions[i * 3 + 1] = pos.y + 1;
        positions[i * 3 + 2] = pos.z;

        particleVelocities[i].set(
          (Math.random() - 0.5) * 6,
          Math.random() * 5 + 1,
          (Math.random() - 0.5) * 6
        );
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    // 5. MODEL MONSTER IBLIS DEMON (SERAM & DETAIL)
    function createDemonMonster() {
      const monster = new THREE.Group();

      // Badan Monster Iblis
      const bodyGeo = new THREE.DodecahedronGeometry(0.8, 1);
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.5, metalness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, skinMat);
      body.position.y = 1.0;
      body.castShadow = true;
      monster.add(body);

      // Mata Merah Menyala
      [-0.25, 0.25].forEach(x => {
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xfacc15 })
        );
        eye.position.set(x, 1.2, 0.65);
        monster.add(eye);
      });

      // Tanduk Iblis (Horns)
      [-0.4, 0.4].forEach(x => {
        const horn = new THREE.Mesh(
          new THREE.ConeGeometry(0.12, 0.6, 8),
          new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 })
        );
        horn.position.set(x, 1.6, 0.2);
        horn.rotation.z = x > 0 ? -0.4 : 0.4;
        horn.rotation.x = -0.2;
        monster.add(horn);
      });

      // Gada Berduri (Spiked Mace Weapon)
      const maceGroup = new THREE.Group();
      const maceHead = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 })
      );
      maceGroup.add(maceHead);
      maceGroup.position.set(0.8, 1.0, 0.4);
      monster.add(maceGroup);

      return monster;
    }

    const enemies = [];
    function spawnEnemy() {
      if (enemies.length >= 5) return;

      const monsterMesh = createDemonMonster();
      const angle = Math.random() * Math.PI * 2;
      const dist = 12 + Math.random() * 10;
      monsterMesh.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

      scene.add(monsterMesh);
      enemies.push({ mesh: monsterMesh, hp: 60, maxHp: 60, isDead: false, hitTimer: 0 });
    }
    for(let i = 0; i < 3; i++) spawnEnemy();
    setInterval(spawnEnemy, 3500);

    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 300);
    }, 400);

    // 6. KONTROL KAMERA & TEBASAN PEDANG
    let camYaw = 0;
    let camPitch = 0.35;
    let camDist = 9.0;
    let isDragging = false;
    let lastX = 0, lastY = 0;

    window.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      camYaw -= (e.clientX - lastX) * 0.004;
      camPitch = Math.max(0.1, Math.min(1.1, camPitch + (e.clientY - lastY) * 0.004));
      lastX = e.clientX; lastY = e.clientY;
    });

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('click', performAttack);
    window.addEventListener('keydown', e => { if (e.code === 'Space') performAttack(); });

    let isAttacking = false;
    let attackProgress = 0;
    let cameraShake = 0;
    let playerHp = 100, kills = 0, level = 1;

    function performAttack() {
      if (isAttacking) return;
      isAttacking = true;
      attackProgress = 0;

      // Efek Arc Tebasan Pedang
      const attackDir = new THREE.Vector3(0, 0, -1).applyQuaternion(player.mesh.quaternion);
      slashArc.position.copy(player.mesh.position).add(attackDir.clone().multiplyScalar(1.2));
      slashArc.position.y = 1.2;
      slashArc.rotation.z = -player.mesh.rotation.y + Math.PI / 4;
      slashMat.opacity = 0.9;

      // Cek Hit Monster
      enemies.forEach((e, idx) => {
        if (e.isDead) return;
        const dist = player.mesh.position.distanceTo(e.mesh.position);
        if (dist < 3.2) {
          e.hp -= 30;
          e.hitTimer = 0.2; // Hit flash
          triggerHitSparks(e.mesh.position);
          cameraShake = 0.2; // Guncangan kamera saat tebasan kena

          if (e.hp <= 0) {
            scene.remove(e.mesh);
            enemies.splice(idx, 1);
            kills++;
            if (kills % 3 === 0) level++;
            document.getElementById('kills').innerText = kills;
            document.getElementById('lvl').innerText = level;
          }
        }
      });
    }

    // 7. GAME LOOP UTAMA (SMOOTH 60 FPS)
    const clock = new THREE.Clock();
    let walkCycle = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      // Animation Tebasan Pedang Ksatria
      if (isAttacking) {
        attackProgress += delta * 6;
        player.armR.rotation.x = -Math.sin(attackProgress * Math.PI) * 1.8;
        player.armR.rotation.y = -Math.sin(attackProgress * Math.PI) * 0.8;
        slashMat.opacity = Math.max(0, 0.9 - attackProgress);

        if (attackProgress >= 1) {
          isAttacking = false;
          player.armR.rotation.set(0, 0, 0);
          slashMat.opacity = 0;
        }
      }

      // Animasi Partikel Spark Perang
      if (particleMat.opacity > 0) {
        particleMat.opacity -= delta * 2;
        const positions = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          positions[i * 3] += particleVelocities[i].x * delta;
          positions[i * 3 + 1] += particleVelocities[i].y * delta;
          positions[i * 3 + 2] += particleVelocities[i].z * delta;
          particleVelocities[i].y -= 9.8 * delta; // Graviti
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
      }

      // Pergerakan WASD Presisi Relatif Terhadap Arah Kamera
      let inputX = 0, inputZ = 0;
      if (keys['KeyW'] || keys['ArrowUp']) inputZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) inputZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) inputX += 1;

      const isMoving = inputX !== 0 || inputZ !== 0;

      if (isMoving) {
        const sin = Math.sin(camYaw);
        const cos = Math.cos(camYaw);
        const dirX = inputX * cos + inputZ * sin;
        const dirZ = -inputX * sin + inputZ * cos;

        const speed = 7.5;
        player.mesh.position.x += dirX * speed * delta;
        player.mesh.position.z += dirZ * speed * delta;

        // Rotasi Slerp Halus
        const targetAngle = Math.atan2(dirX, dirZ);
        const targetQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), targetAngle);
        player.mesh.quaternion.slerp(targetQuat, 16 * delta);

        // Procedural Leg Swing (Jalan Mulus)
        walkCycle += delta * 12;
        player.legL.rotation.x = Math.sin(walkCycle) * 0.6;
        player.legR.rotation.x = -Math.sin(walkCycle) * 0.6;
      } else {
        player.legL.rotation.x = THREE.MathUtils.lerp(player.legL.rotation.x, 0, 0.2);
        player.legR.rotation.x = THREE.MathUtils.lerp(player.legR.rotation.x, 0, 0.2);
      }

      // Update Kamera 360 & Guncangan Kamera (Camera Shake)
      let shakeX = (Math.random() - 0.5) * cameraShake;
      let shakeY = (Math.random() - 0.5) * cameraShake;
      cameraShake = Math.max(0, cameraShake - delta * 2);

      const cx = player.mesh.position.x + camDist * Math.sin(camYaw) * Math.cos(camPitch) + shakeX;
      const cy = player.mesh.position.y + camDist * Math.sin(camPitch) + shakeY;
      const cz = player.mesh.position.z + camDist * Math.cos(camYaw) * Math.cos(camPitch);

      camera.position.set(cx, cy, cz);
      camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1.2, player.mesh.position.z);

      swordAuraLight.position.set(player.mesh.position.x, 2, player.mesh.position.z);

      // Pergerakan Musuh Demon Mengejar Player
      enemies.forEach(e => {
        if (!e.isDead) {
          const dir = new THREE.Vector3().subVectors(player.mesh.position, e.mesh.position);
          dir.y = 0;
          const dist = dir.length();
          dir.normalize();

          if (dist > 1.5) {
            e.mesh.position.x += dir.x * 2.5 * delta;
            e.mesh.position.z += dir.z * 2.5 * delta;
            e.mesh.rotation.y = Math.atan2(dir.x, dir.z);
          } else {
            playerHp -= 12 * delta;
            document.getElementById('hp-bar').style.width = Math.max(0, playerHp) + '%';
            if (playerHp <= 0) {
              alert('Game Over! Kesatria telah gugur.');
              location.reload();
            }
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
