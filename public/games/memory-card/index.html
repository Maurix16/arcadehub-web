<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Match</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #090d16; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
    }
    .header { margin-bottom: 16px; text-align: center; }
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      max-width: 360px; width: 100%; padding: 10px;
    }
    .card {
      aspect-ratio: 1; background: #1e293b; border: 2px solid #334155; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      cursor: pointer; user-select: none; transition: transform 0.3s, background 0.3s;
    }
    .card.flipped { background: #3b82f6; border-color: #60a5fa; transform: rotateY(180deg); }
    .card.matched { background: #10b981; border-color: #34d399; cursor: default; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Memory Card Match 🃏</h2>
    <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Langkah: <span id="moves">0</span></p>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const icons = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
    let cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
    const grid = document.getElementById('grid');
    const movesEl = document.getElementById('moves');

    let flippedCards = [];
    let matchedCount = 0;
    let moves = 0;

    cards.forEach((icon, index) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.icon = icon;
      card.dataset.index = index;
      card.addEventListener('click', () => flipCard(card));
      grid.appendChild(card);
    });

    function flipCard(card) {
      if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      card.classList.add('flipped');
      card.innerText = card.dataset.icon;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.icon === c2.dataset.icon) {
        c1.classList.add('matched');
        c2.classList.add('matched');
        matchedCount += 2;
        flippedCards = [];
        if (matchedCount === cards.length) {
          setTimeout(() => alert(`Selamat! Kamu menang dalam ${moves} langkah!`), 300);
        }
      } else {
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          c1.innerText = '';
          c2.innerText = '';
          flippedCards = [];
        }, 800);
      }
    }
  </script>
</body>
</html>
